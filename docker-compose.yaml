services:
  web-server:
    image: caddy:2.11.1-alpine
    container_name: web-server
    depends_on:
      - todoapp
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./out/caddy_data:/data
      - ./web/public:/web/public:ro
    ports:
      - "80:80"
    restart: always

  todoapp:
    build:
      context: .
      dockerfile: cmd/todoapp/Dockerfile
    container_name: todoapp
    depends_on:
      todoapp-postgres:
        condition: service_healthy
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=todoapp-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ./out/logs:/app/out/logs
    restart: always

  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    command:
      - "tcp-listen:5432,fork,reuseaddr"
      - "tcp-connect:todoapp-postgres:5432"
    ports:
      - "127.0.0.1:5432:5432"

  swagger:
    build: 
      context: .
      dockerfile_inline: |
        FROM golang:1.26.4-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.4
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - .:/code
